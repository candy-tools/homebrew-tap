# EXAMPLE — this file belongs in each TOOL's own repository as `.goreleaser.yaml`.
# It does NOT belong in the tap repo; the tap only holds generated casks.
#
# On every tagged release, GoReleaser builds the binaries and commits a cask
# into candy-tools/homebrew-tap under Casks/. Users then run:
#   brew tap candy-tools/tap
#   brew install tool-a
#
# The release workflow needs a GitHub token with write access to the tap repo,
# exposed as TAP_GITHUB_TOKEN (the default GITHUB_TOKEN cannot push to another
# repository).

version: 2

builds:
  - id: tool-a
    binary: tool-a
    goos: [darwin] # casks are macOS-only; add linux here only if you also ship .deb/.rpm/etc.
    goarch: [amd64, arm64]

archives:
  - id: tool-a
    formats: [tar.gz]

homebrew_casks:
  - name: tool-a
    repository:
      owner: candy-tools
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/candy-tools/tool-a"
    description: "One-line description of tool-a"
    license: "MIT"
    url:
      verified: "github.com/candy-tools/tool-a/"
    # macOS blocks unsigned / un-notarized binaries. If yours aren't signed,
    # strip the quarantine attribute on install:
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tool-a"]
          end
